<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #eaeaea;
    gap: 16px;
    padding: 20px;
    user-select: none;
  }
  h1 { font-size: 24px; letter-spacing: 2px; color: #4ade80; }
  .hud {
    display: flex;
    gap: 32px;
    font-size: 16px;
    font-variant-numeric: tabular-nums;
  }
  .hud span b { color: #4ade80; }
  .board-wrap { position: relative; }
  canvas {
    background: #16213e;
    border-radius: 8px;
    box-shadow: 0 0 0 2px #0f3460, 0 8px 30px rgba(0,0,0,.5);
    display: block;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(10, 15, 30, .82);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; color: #4ade80; }
  .overlay p { font-size: 14px; color: #a0a0b0; line-height: 1.6; }
  .btn {
    margin-top: 6px;
    padding: 10px 26px;
    font-size: 15px;
    color: #0a0f1e;
    background: #4ade80;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: transform .1s, background .15s;
  }
  .btn:hover { background: #6ee7a0; }
  .btn:active { transform: scale(.96); }
  .btn.ghost {
    margin-top: 0;
    background: transparent;
    color: #4ade80;
    box-shadow: inset 0 0 0 2px #0f3460;
  }
  .btn.ghost:hover { background: rgba(74,222,128,.1); }
  .btn.ghost.on {
    background: #4ade80;
    color: #0a0f1e;
    box-shadow: none;
  }
  .hint { font-size: 13px; color: #6b7280; }
  .ai-controls {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .slider {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #a0a0b0;
  }
  .slider input[type=range] { width: 150px; accent-color: #4ade80; cursor: pointer; }
  .slider b {
    color: #4ade80;
    font-variant-numeric: tabular-nums;
    min-width: 26px;
    display: inline-block;
    text-align: right;
  }
  .mobile-pad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
    margin-top: 4px;
  }
  .mobile-pad button {
    background: #0f3460;
    color: #4ade80;
    border: none;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
  }
  .mobile-pad button:active { background: #1f5a9a; }
  #pad-up { grid-column: 2; grid-row: 1; }
  #pad-left { grid-column: 1; grid-row: 2; }
  #pad-down { grid-column: 2; grid-row: 2; }
  #pad-right { grid-column: 3; grid-row: 2; }
  @media (hover: none) and (pointer: coarse) {
    .mobile-pad { display: grid; }
  }
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div class="hud">
    <span>得分 <b id="score">0</b></span>
    <span>最高分 <b id="best">0</b></span>
  </div>
  <div class="board-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ov-title">准备开始</h2>
      <p id="ov-text">方向键 / WASD 控制移动<br>吃到食物得分，撞墙或撞到自己结束<br>也可开启下方「自动模式」让蛇自己吃豆</p>
      <button class="btn" id="start-btn">开始游戏</button>
    </div>
  </div>
  <p class="hint">空格键暂停 / 继续</p>
  <button class="btn ghost" id="auto-btn">自动模式：关</button>
  <div class="ai-controls">
    <button class="btn ghost" id="strat-btn">策略：哈密顿</button>
    <label class="slider">AI 速度
      <input type="range" id="speed-range" min="5" max="60" step="1" value="15">
      <b id="speed-val">15</b>
    </label>
  </div>
  <div class="mobile-pad">
    <button id="pad-up">▲</button>
    <button id="pad-left">◀</button>
    <button id="pad-down">▼</button>
    <button id="pad-right">▶</button>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ov-title');
  const ovText = document.getElementById('ov-text');
  const startBtn = document.getElementById('start-btn');
  const autoBtn = document.getElementById('auto-btn');
  const stratBtn = document.getElementById('strat-btn');
  const speedRange = document.getElementById('speed-range');
  const speedVal = document.getElementById('speed-val');

  const CELL = 20;
  const COLS = canvas.width / CELL;
  const ROWS = canvas.height / CELL;

  let snake, dir, nextDir, food, score, best, speed, acc, lastTime;
  let state = 'ready'; // ready | running | paused | over
  let auto = false;    // 自动模式开关
  let strategy = 'ham'; // 自动走法：'ham' 哈密顿回路 | 'greedy' 贪心寻路
  let aiSpeed = 15;     // 自动模式基础速度（每秒格数）

  const DIRS = [{ x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }];
  const kk = (x, y) => x + ',' + y;

  // 每秒移动格数：自动模式用滑块设定的基础速度
  function speedFor(sc) {
    if (auto) return Math.min(aiSpeed + Math.floor(sc / 50), 60);
    return Math.min(8 + Math.floor(sc / 50), 20);
  }

  best = Number(localStorage.getItem('snake-best') || 0);
  bestEl.textContent = best;

  function reset() {
    // 初始蛇身放在哈密顿回路上，这样开启自动模式时 AI 可以直接沿回路运行
    const i0 = 2;
    snake = [CYCLE[i0], CYCLE[i0 - 1], CYCLE[i0 - 2]].map(c => ({ x: c.x, y: c.y }));
    const nxt = CYCLE[(i0 + 1) % LEN];
    dir = { x: nxt.x - snake[0].x, y: nxt.y - snake[0].y };
    nextDir = { x: dir.x, y: dir.y };
    score = 0;
    speed = speedFor(0);
    acc = 0;
    lastTime = 0;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const empty = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) empty.push({ x, y });
      }
    }
    if (!empty.length) { food = null; return false; } // 蛇填满棋盘，胜利
    food = empty[Math.floor(Math.random() * empty.length)];
    return true;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
    }
    for (let i = 1; i < ROWS; i++) {
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // 食物
    if (food) {
      ctx.fillStyle = '#ff5c5c';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 蛇
    snake.forEach((s, i) => {
      const t = i / Math.max(snake.length - 1, 1);
      ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(74,222,128,${0.85 - t * 0.45})`;
      const pad = i === 0 ? 1 : 2;
      roundRect(s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- 自动模式：哈密顿回路 + 安全抄近路 ----
  // 构造一条覆盖全部格子的回路（要求 ROWS 为偶数），蛇沿回路前进就绝不会自撞
  function buildCycle() {
    const cyc = [];
    for (let x = 0; x < COLS; x++) cyc.push({ x, y: 0 });
    for (let y = 1; y < ROWS; y++) {
      if (y % 2 === 1) for (let x = COLS - 1; x >= 1; x--) cyc.push({ x, y });
      else            for (let x = 1; x <= COLS - 1; x++) cyc.push({ x, y });
    }
    cyc.push({ x: 0, y: ROWS - 1 });
    for (let y = ROWS - 2; y >= 1; y--) cyc.push({ x: 0, y });
    return cyc;
  }
  const CYCLE = buildCycle();
  const LEN = CYCLE.length;
  const CIDX = new Map();
  CYCLE.forEach((c, i) => CIDX.set(kk(c.x, c.y), i));
  const cdist = (a, b) => ((b - a) % LEN + LEN) % LEN; // 沿回路前向距离

  // 哈密顿策略：默认沿回路走；当食物在前方且能安全抄近路时，走更短的捷径
  function chooseHamilton() {
    const head = snake[0];
    const headIdx = CIDX.get(kk(head.x, head.y));
    const tail = snake[snake.length - 1];
    const tailIdx = CIDX.get(kk(tail.x, tail.y));
    const foodIdx = food ? CIDX.get(kk(food.x, food.y)) : -1;
    const len = snake.length;
    const gap = cdist(headIdx, tailIdx); // 头 -> 尾 的前向距离

    const body = new Set();
    for (let i = 0; i < snake.length - 1; i++) body.add(kk(snake[i].x, snake[i].y));

    const cands = [];
    // 兜底：回路下一格（只要没被身体占据就一定安全）
    const defIdx = (headIdx + 1) % LEN, defCell = CYCLE[defIdx];
    if (!body.has(kk(defCell.x, defCell.y))) {
      cands.push({ ci: defIdx, dir: { x: defCell.x - head.x, y: defCell.y - head.y } });
    }
    // 抄近路：只能落在“头 -> 尾”这段前向弧内，且与尾巴保持足够距离
    for (const d of DIRS) {
      const nx = head.x + d.x, ny = head.y + d.y;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      const ni = CIDX.get(kk(nx, ny));
      if (ni === undefined || ni === defIdx || body.has(kk(nx, ny))) continue;
      const jump = cdist(headIdx, ni);
      if (jump <= 0 || jump >= gap) continue;   // 不能后退，也不能越过尾巴
      if (cdist(ni, tailIdx) <= len) continue;  // 与尾巴的安全距离
      cands.push({ ci: ni, dir: d });
    }

    if (!cands.length) {
      // 兜底（如手动玩到一半再切自动）：任选一个不撞身体的方向
      for (const d of DIRS) {
        const nx = head.x + d.x, ny = head.y + d.y;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        let hit = false;
        for (let i = 0; i < snake.length - 1; i++) {
          if (snake[i].x === nx && snake[i].y === ny) { hit = true; break; }
        }
        if (!hit) return d;
      }
      return dir;
    }

    let best = cands[0], bs = foodIdx >= 0 ? cdist(best.ci, foodIdx) : 0;
    for (const c of cands) {
      const s = foodIdx >= 0 ? cdist(c.ci, foodIdx) : 0;
      if (s < bs) { bs = s; best = c; }
    }
    return best.dir;
  }

  // ---- 贪心策略：BFS 直奔食物，同时兼顾不与尾巴脱节、留出活动空间 ----
  function bfs(from, to, blocked) {
    if (from.x === to.x && from.y === to.y) return 0;
    const seen = new Set([kk(from.x, from.y)]);
    let frontier = [[from.x, from.y]], depth = 0;
    while (frontier.length) {
      depth++;
      const next = [];
      for (const [cx, cy] of frontier) {
        for (const d of DIRS) {
          const nx = cx + d.x, ny = cy + d.y;
          if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
          const k = kk(nx, ny);
          if (seen.has(k) || blocked.has(k)) continue;
          if (nx === to.x && ny === to.y) return depth;
          seen.add(k); next.push([nx, ny]);
        }
      }
      frontier = next;
    }
    return -1;
  }

  function floodCount(sx, sy, blocked) {
    const seen = new Set([kk(sx, sy)]);
    const stack = [[sx, sy]];
    let count = 0;
    while (stack.length) {
      const [cx, cy] = stack.pop();
      count++;
      for (const d of DIRS) {
        const nx = cx + d.x, ny = cy + d.y;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        const k = kk(nx, ny);
        if (seen.has(k) || blocked.has(k)) continue;
        seen.add(k); stack.push([nx, ny]);
      }
    }
    return count;
  }

  function chooseGreedy() {
    const head = snake[0];
    let best = null, bestScore = -Infinity;
    for (const d of DIRS) {
      if (d.x === -dir.x && d.y === -dir.y) continue; // 不能原地掉头
      const nx = head.x + d.x, ny = head.y + d.y;
      if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
      let hit = false;
      for (let i = 0; i < snake.length - 1; i++) {
        if (snake[i].x === nx && snake[i].y === ny) { hit = true; break; }
      }
      if (hit) continue;

      const willEat = food && nx === food.x && ny === food.y;
      const newSnake = willEat
        ? [{ x: nx, y: ny }, ...snake]
        : [{ x: nx, y: ny }, ...snake.slice(0, snake.length - 1)];
      const blocked = new Set();
      for (let i = 1; i < newSnake.length - 1; i++) blocked.add(kk(newSnake[i].x, newSnake[i].y));

      let s = 0;
      const df = food ? bfs({ x: nx, y: ny }, food, blocked) : -1;
      const dt = bfs({ x: nx, y: ny }, newSnake[newSnake.length - 1], blocked);
      if (dt < 0) s -= 200000;                  // 别把自己跟尾巴隔开
      if (df >= 0) {
        s += (400 - df) * 50;                   // 走离食物最短的路
      } else {
        s -= 100000;
        if (dt >= 0) s -= dt * 20;              // 吃不到就先去追尾巴解缠
      }
      s += floodCount(nx, ny, blocked) * 8;     // 多留活动空间
      if (s > bestScore) { bestScore = s; best = d; }
    }
    return best || dir;
  }

  // 自动模式入口：按当前策略选择方向
  function chooseDirection() {
    return strategy === 'greedy' ? chooseGreedy() : chooseHamilton();
  }

  function step() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();
    // 撞自己（尾巴即将移动，除尾巴外）
    for (let i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      speed = speedFor(score);
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snake-best', best);
      }
      if (!placeFood()) return win();
    } else {
      snake.pop();
    }
  }

  function loop(time) {
    if (state !== 'running') return;
    if (!lastTime) lastTime = time;
    const dt = (time - lastTime) / 1000;
    lastTime = time;
    acc += dt;
    const interval = 1 / speed;
    while (acc >= interval) {
      if (auto) nextDir = chooseDirection();
      step();
      acc -= interval;
      if (state !== 'running') break;
    }
    draw();
    if (state === 'running') requestAnimationFrame(loop);
  }

  function win() {
    state = 'over';
    ovTitle.textContent = '恭喜通关！';
    ovText.innerHTML = `蛇填满了整个棋盘 🐍<br>得分 <b style="color:#4ade80">${score}</b>`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
    draw();
  }

  function gameOver() {
    state = 'over';
    ovTitle.textContent = '游戏结束';
    ovText.innerHTML = `本局得分 <b style="color:#4ade80">${score}</b><br>最高分 ${best}`;
    startBtn.textContent = '再来一局';
    overlay.classList.remove('hidden');
    draw();
  }

  function start() {
    reset();
    state = 'running';
    overlay.classList.add('hidden');
    lastTime = 0;
    draw();
    requestAnimationFrame(loop);
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      ovTitle.textContent = '已暂停';
      ovText.textContent = '按空格键继续';
      startBtn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'running';
      overlay.classList.add('hidden');
      lastTime = 0;
      requestAnimationFrame(loop);
    }
  }

  function turn(nx, ny) {
    // 不能 180° 反向
    if (nx === -dir.x && ny === -dir.y) return;
    nextDir = { x: nx, y: ny };
  }

  const KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };

  document.addEventListener('keydown', e => {
    if (e.key === ' ') {
      e.preventDefault();
      if (state === 'running' || state === 'paused') togglePause();
      else start();
      return;
    }
    const k = KEYS[e.key];
    if (!k) return;
    e.preventDefault();
    if (auto || state === 'ready' || state === 'over') return;
    turn(k[0], k[1]);
  });

  startBtn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });

  // 自动模式开关
  function updateAutoBtn() {
    autoBtn.textContent = '自动模式：' + (auto ? '开' : '关');
    autoBtn.classList.toggle('on', auto);
  }
  autoBtn.addEventListener('click', () => {
    auto = !auto;
    updateAutoBtn();
    // 开启自动模式时重开一局，让蛇身落在回路的起跑位置
    if (auto) start();
  });
  updateAutoBtn();

  // 策略切换：哈密顿回路 / 贪心寻路（切换后重开，保证从合法状态起跑）
  function updateStratBtn() {
    stratBtn.textContent = '策略：' + (strategy === 'greedy' ? '贪心' : '哈密顿');
  }
  stratBtn.addEventListener('click', () => {
    strategy = strategy === 'greedy' ? 'ham' : 'greedy';
    updateStratBtn();
    if (auto) start();
  });
  updateStratBtn();

  // AI 速度滑块
  speedRange.addEventListener('input', () => {
    aiSpeed = Number(speedRange.value);
    speedVal.textContent = aiSpeed;
    if (auto && state === 'running') speed = speedFor(score); // 立即生效
  });

  // 移动端方向键
  [['pad-up', 0, -1], ['pad-down', 0, 1], ['pad-left', -1, 0], ['pad-right', 1, 0]]
    .forEach(([id, x, y]) => {
      const el = document.getElementById(id);
      el.addEventListener('click', () => {
        if (auto) return;
        if (state === 'running') turn(x, y);
        else if (state === 'ready' || state === 'over') start();
      });
    });

  // 触摸滑动
  let tx = 0, ty = 0;
  canvas.addEventListener('touchstart', e => {
    tx = e.touches[0].clientX; ty = e.touches[0].clientY;
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    const dy = e.changedTouches[0].clientY - ty;
    if (auto) return;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
  }, { passive: true });

  reset();
  draw();
})();
</script>
</body>
</html>
